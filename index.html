let challengeState=null;
function challengeDay(){return new Date().toLocaleDateString('sv-SE')}
function challengeStart(mode){const prev=challengeState?.mode===mode?challengeState.last:-1;let ix=Math.floor(Math.random()*challengeQuestions[mode].length);if(ix===prev)ix=(ix+1)%challengeQuestions[mode].length;const answers=[0,1,2].sort(()=>Math.random()-.5);challengeState={mode,ix,last:ix,answers,answered:false,chosen:-1,round:0,correct:0};tab=mode;render()}
function challengeNext(){const c=challengeState;if(!c)return;let ix=Math.floor(Math.random()*challengeQuestions[c.mode].length);if(ix===c.ix)ix=(ix+1)%challengeQuestions[c.mode].length;c.ix=ix;c.last=ix;c.answers=[0,1,2].sort(()=>Math.random()-.5);c.answered=false;c.chosen=-1;render()}
function challengePick(i){const c=challengeState;if(!c||c.answered||i<0||i>2)return;c.chosen=i;c.answered=true;c.round++;const right=c.answers[i]===challengeQuestions[c.mode][c.ix][2];if(right){c.correct++;activityLogAdd('quiz',c.mode)}const p=u(),day=challengeDay();if(p.challengeRewardDay!==day){p.challengeRewardDay=day;p.challengeCorrectToday=0;p.challengeCoinsToday=0}if(right){p.challengeCorrectToday=(p.challengeCorrectToday||0)+1;if(p.challengeCorrectToday%6===0&&(p.challengeCoinsToday||0)<4){p.challengeCoinsToday++;p.coins=(p.coins||0)+1;notify('6 richtige Antworten · +1 Coin')}}persist();render()}

function vocabScanDialog(){vocabDialog(`<div class="vocab-scan"><p>Fotografiere oder lade ein Vokabelblatt hoch. Die Erkennung funktioniert mit klaren zweispaltigen Vorlagen am besten.</p><div class="scan-upload-actions"><label class="btn primary" for="vocab-image-camera">Kamera verwenden<input type="file" accept="image/*" capture="environment" id="vocab-image-camera" onchange="G.vocabFile(event)" hidden></label><label class="btn" for="vocab-image">Bild auswählen<input type="file" accept="image/*" id="vocab-image" onchange="G.vocabFile(event)" hidden></label></div><div id="vocab-scan-preview"></div><button class="btn primary" style="margin-top:12px" onclick="G.vocabOCR()">▣ Text erkennen</button><p class="muted small" id="vocab-ocr-status">Die Texterkennung benötigt eine Internetverbindung.</p><label class="field" style="text-align:left;margin-top:12px">Reihenfolge auf dem Blatt<select id="vocab-order"><option value="foreign">Fremdsprache links · Deutsch rechts</option><option value="de">Deutsch links · Fremdsprache rechts</option></select></label></div><label class="field" style="margin:16px 0">Alternativ: Wörter als Text einfügen (Deutsch ; Fremdsprache)<textarea id="vocab-paste" rows="5" style="background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px" placeholder="Haus ; house&#10;Baum ; tree"></textarea></label><button class="btn" onclick="G.vocabParseText()">Text übernehmen</button><div id="vocab-draft-holder"></div>`)}
function vocabParse(raw){const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const out=[];for(const line of lines){let parts=line.split(/\s*[;\t|→=]\s*| {2,}/).map(x=>x.trim()).filter(Boolean);if(parts.length<2)parts=line.split(/\s+[-–—:]\s+/).map(x=>x.trim()).filter(Boolean);if(parts.length>=2&&parts[0].length<100&&parts.slice(1).join(' ').length<140)out.push({de:parts[0],foreign:parts.slice(1).join(' ')});}return out}

function friendsPage(){if(!cloudClient)return empty('♡','Cloud erforderlich','Freunde benötigen Supabase.');const uid=cloudUser?.id;const cards=new Map(friendCards.map(c=>[c.user_id,c]));const accepted=friendRelations.filter(r=>r.status==='accepted');const pending=friendRelations.filter(r=>r.status==='pending');return `${top('Deine <span class="gradient">Freunde.</span>','Gemeinsam lernen, Erfolge feiern und Profile entdecken.')}${card('Freunde hinzufügen',`<div class="friend-code-box"><div><small class="muted">Dein Code</small><strong>${e(myFriendCode())}</strong></div><button class="chip" onclick="G.copyFriendCode()">Kopieren</button></div><form class="friend-add" onsubmit="G.friendInvite(event)"><input name="code" placeholder="Freundescode eingeben (GO-…)" maxlength="20" required><button type="submit" class="btn primary">Anfrage senden</button></form><p class="muted small">Freundschaften sind gegenseitig und müssen angenommen werden.</p>`)}${pending.length?card('Freundschaftsanfragen',`<div class="friend-gallery">${pending.map(r=>{const receiving=r.receiver_id===uid,c=cards.get(receiving?r.sender_id:r.receiver_id)||{display_name:'Profil'};return friendPreview(c,receiving?`<div class="friend-actions"><button class="btn primary" onclick="G.friendRespond('${e(r.id)}','accepted')">Annehmen</button><button class="btn" onclick="G.friendRespond('${e(r.id)}','declined')">Ablehnen</button></div>`:'<span class="tag">Anfrage gesendet</span>')}).join('')}</div>`):''}${card(`Deine Freunde (${accepted.length})`,accepted.length?`<div class="friend-gallery">${accepted.map(r=>{const other=r.sender_id===uid?r.receiver_id:r.sender_id,c=cards.get(other)||{display_name:'Profil'};return friendPreview(c,`<div class="friend-actions"><button class="btn primary" onclick="G.friendCheer('${e(other)}')">✦ High-five senden</button><button class="btn" onclick="G.friendRemove('${e(r.id)}')">Entfernen</button></div>${friendReactionsFor(other)}`)}).join('')}</div>`:empty('♡','Noch keine Freunde', function localISO(date=new Date()){const d=new Date(date.getTime()-date.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)}
function daysFromToday(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return 99999;const [y,m,d]=iso.split('-').map(Number);const now=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000)}
function activityLogAdd(type,meta=''){const list=u().activityLog??=[];list.push({date:localISO(),type,meta:String(meta).slice(0,50)});if(list.length>400)list.splice(0,list.length-400);u().activityLog=list}
function examPriority(){return (u().exams||[]).filter(x=>daysFromToday(x.date)>=0).map(x=>{const days=daysFromToday(x.date);const values=u().grades.filter(g=>g.subject===x.subject).map(g=>Number(g.points)).filter(Number.isFinite);const meanVal=values.length?values.reduce((a,b)=>a+b,0)/values.length:null;const weakness=meanVal===null?9:Math.max(0,12-meanVal)*5;const urgency=Math.max(0,60-days*2.5);return {...x,days,meanVal,priority:urgency+weakness};}).sort((a,b)=>b.priority-a.priority)}
function examIntelligenceDashboard(){const upcoming=examPriority(),next=[...upcoming].sort((a,b)=>a.days-b.days)[0];const countdown=next?`<div class="exam-next-number">${next.days===0?'HEUTE':next.days===1?'MORGEN':next.days+' TAGE'}</div><strong>${e(next.subject)}</strong><small class="muted">${new Date(next.date+'T12:00:00').toLocaleDateString('de-DE')} · ${e(next.description||'Nächste Klausur')}</small>`:`<div class="exam-next-number">—</div><strong>Keine Klausur geplant</strong><small class="muted">Trage Termine im Klausurenkalender ein.</small>`;const priorities=upcoming.slice(0,3).map((x,i)=>`<div class="priority-row"><span class="priority-num">0${i+1}</span><div><strong>${e(x.subject)}</strong><small>${x.days===0?'Heute':x.days+' Tage'} · ${x.meanVal===null?'Noch keine Noten':fmt(x.meanVal)+' Punkte bisher'}</small></div><span class="priority-tag ${x.days<=5?'urgent':''}">${x.days<=5?'Dringend':x.meanVal!==null&&x.meanVal<9?'Üben':'Planen'}</span></div>`).join('');return `<div class="grid2 gradeos-insights">${card('Nächste Klausur · Countdown',`<div class="exam-countdown">${countdown}</div><button class="chip" onclick="G.nav('calendar')">Kalender öffnen →</button>`)}${card('Klausuren-Priorität',`<p class="muted small">Gewichtet nach verbleibenden Tagen und bisherigen Fachpunkten. Nur eine Lernhilfe.</p>${priorities||empty('◎','Keine anstehenden Klausuren','Die Analyse startet mit deinem ersten Klausurtermin.')}`)}</div>`}
function weekStart(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return localISO(d)}
function weeklyReviewCard(){const start=weekStart(),today=localISO(),logs=(u().activityLog||[]).filter(x=>x.date>=start&&x.date<=today);const lessons=logs.filter(x=>x.type==='vocab').length,quizzes=logs.filter(x=>x.type==='quiz').length;const newGrades=u().grades.filter(x=>x.date>=start&&x.date<=today).length;const uniqueDays=new Set(logs.map(x=>x.date)).size;return `<section class="card section weekly-review"><div class="row"><div><span class="eyebrow">DEIN WOCHENRÜCKBLICK</span><h2 style="margin-top:7px">Diese Woche in GRADEOS</h2></div><span class="pill">Seit Montag</span></div><div class="weekly-metrics"><div><strong>${lessons}</strong><span>Vokabel-Antworten</span></div><div><strong>${quizzes}</strong><span>Richtige Quizantworten</span></div><div><strong>${newGrades}</strong><span>Eingetragene Noten</span></div><div><strong>${uniqueDays}</strong><span>Aktive Tage</span></div></div><p class="muted small">Lernaktivitäten werden ab Version 28.0 erfasst. Ältere Quizrunden sind nicht rückwirkend enthalten.</p></section>`}

function gradeGoalPage(){const names=[...new Set([...(u().enabled||[]),...u().grades.map(x=>x.subject),...subjects])];const chosen=window.gradeGoalSubject&&names.includes(window.gradeGoalSubject)?window.gradeGoalSubject:names[0];const category=window.gradeGoalCategory||'Klausuren';const count=Number(window.gradeGoalCount)||2,target=Number(window.gradeGoalTarget)||11;const currentGrades=u().grades.filter(x=>x.subject===chosen&&x.category===category),sum=currentGrades.reduce((a,g)=>a+g.points,0),need=(target*(currentGrades.length+count)-sum)/count;const possible=need<=15&&need>=0;return `${top('Dein <span class="gradient">Noten-Zielrechner.</span>','Wie viele Punkte brauchst du für dein nächstes Lernziel?')}<div class="grid2">${card('Ziel festlegen',`<div class="form"><label class="field">Fach<select id="goal-subject" onchange="G.goalUpdate()">${selectOptions(names,chosen)}</select></label><label class="field">Notenkategorie<select id="goal-category" onchange="G.goalUpdate()">${selectOptions(cats,category)}</select></label><label class="field">Gewünschter Kategorie-Durchschnitt: <strong>${target} Punkte</strong><input id="goal-target" type="range" min="0" max="15" value="${target}" step="1" oninput="G.goalUpdate()"></label><label class="field">Noch erwartete Noten<select id="goal-count" onchange="G.goalUpdate()">${selectOptions(['1','2','3','4','5','6'],String(count))}</select></label></div>`)}${card('Dein Ergebnis',`<div class="goal-result ${possible?'':'goal-impossible'}"><small>Benötigter Durchschnitt über ${count} neue ${count===1?'Note':'Noten'}</small><div class="goal-huge">${need>15?'Mehr als 15':need<0?'Bereits erreicht':fmt(need,2)}<small>${need>=0&&need<=15?' Punkte':''}</small></div><p>${need>15?'Mit maximal 15 Punkten pro Note ist dieses Ziel bei der gewählten Anzahl nicht erreichbar.':need<0?'Deine bisherigen Ergebnisse liegen bereits so hoch, dass das Ziel auch mit niedrigeren neuen Noten erreichbar ist.':`Plane ungefähr ${Math.ceil(need)} Punkte pro wei // the client: restrict them to the GitHub Pages origin and only Maps JavaScript API.
function geoLoadGoogleMaps(key){
 if(window.google?.maps?.StreetViewService)return Promise.resolve(window.google.maps);
 if(geoGoogleLoad)return geoGoogleLoad;

  const callback='gradeosGeoStreetViewReady';
  const script=document.createElement('script');
  let settled=false;const finish=(error)=>{if(settled)return;settled=true;clearTimeout(timer);delete window[callback];if(error)reject(error);else resolve(window.google.maps)};
  const timer=setTimeout(()=>finish(Error('Google Street View hat nicht geantwortet. Key und Verbindung prüfen.')),14000);
  window[callback]=()=>{if(!window.google?.maps?.StreetViewService){finish(Error('Street-View-Modul fehlt.'))}else{finish()}};
  script.async=true;script.defer=true;
  script.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&v=weekly&loading=async&libraries=streetView&callback='+callback+'&language=de';
  script.onerror=()=>finish(Error('Google Maps konnte nicht geladen werden. API-Key und Website-Freigabe prüfen.'));
  document.head.append(script);
