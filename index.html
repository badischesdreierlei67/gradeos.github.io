function drawGame(){const canvas=document.getElementById('runner-canvas');if(!canvas)return;const b=canvas.getBoundingClientRect(),W=Math.max(320,b.width),H=Math.max(250,b.height),dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const floor=H-72;c.fillStyle='#f4f8ff';c.fillRect(0,0,W,H);c.fillStyle='#dae8f7';for(let k=0;k<7;k++){const x=k*220-((game?.distance||0)*6)%220;c.beginPath();c.arc(x+30,80,18,Math.PI,0);c.arc(x+62,70,25,Math.PI,0);c.arc(x+99,80,18,Math.PI,0);c.fill()}c.strokeStyle='#59677c';c.lineWidth=3;c.beginPath();c.moveTo(0,floor);c.lineTo(W,floor);c.stroke();c.fillStyle='#9cabbf';for(let i=0;i<22;i++){let x=(i*85-(game?.distance||0)*11)%(W+85);if(x<0)x+=W+85;c.fillRect(x,floor+13,27,3)}const y=floor-(game?.jumpHeight||0),run=Math.sin((game?.distance||0)*2);c.save();c.translate(104,y);c.strokeStyle='#d0d5df';c.lineWidth=10;c.lineCap='round';c.beginPath();c.moveTo(-16,-5);c.lineTo(-18+run*7,9);c.moveTo(10,-5);c.lineTo(12-run*7,9);c.stroke();c.fillStyle='#fbfdff';c.strokeStyle='#9caac0';c.lineWidth=2;c.beginPath();c.ellipse(-6,-37,33,24,0,0,Math.PI*2);c.fill();c.stroke();c.beginPath();c.moveTo(-20,-54);c.lineTo(-17,-93);c.lineTo(-1,-66);c.lineTo(15,-91);c.lineTo(22,-53);c.closePath();c.fill();c.stroke();c.beginPath();c.ellipse(12,-57,30,27,0,0,Math.PI*2);c.fill();c.stroke();c.fillStyle='#27334a';c.beginPath();c.arc(23,-59,4,0,Math.PI*2);c.fill();c.beginPath();c.ellipse(39,-47,8,5,0,0,Math.PI*2);c.fill();c.fillStyle='#fa788d';c.beginPath();c.ellipse(30,-37+Math.sin((game?.distance||0)*.3)*2,7,12,.1,0,Math.PI*2);c.fill();c.fillStyle='#e6b2c4';c.beginPath();c.ellipse(15,-70,5,9,0,0,Math.PI*2);c.fill();c.restore();for(const o of game?.obstacles||[]){c.fillStyle='#658785';c.strokeStyle='#44615e';c.lineWidth=2;c.fillRect(o.x,floor-48,24,48);c.strokeRect(o.x,floor-48,24,48);c.fillRect(o.x+6,floor-67,10,24);c.fillRect(o.x+23,floor-31,13,9)}c.font='600 function tick(time){if(!game?.running)return;const g=game,dt=Math.min(50,Math.max(0,time-g.lastFrame))/1000;g.lastFrame=time;g.distance+=dt*g.speed;g.speed=Math.min(24,10+g.distance/130);const elapsed=time-g.jumpStart;g.jumpHeight=elapsed>=0&&elapsed<850?Math.sin(Math.PI*elapsed/850)*145:0;const canvas=document.getElementById('runner-canvas'),width=canvas?.getBoundingClientRect().width||800;if(time-g.lastSpawn>Math.max(900,1780-g.distance*1.35)){g.obstacles.push({x:width+40,passed:false});g.lastSpawn=time}for(const o of g.obstacles){o.x-=dt*g.speed*21;if(!o.passed&&o.x<136){if(o.x>81&&g.jumpHeight<55){finishGame();return}o.passed=true;g.score+=10}}g.obstacles=g.obstacles.filter(o=>o.x>-45);drawGame();g.raf=requestAnimationFrame(tick)}
function finishGame(){if(!game)return;const earned=Math.min(10,Math.floor(game.score/10)),score=game.score;game.running=false;cancelAnimationFrame(game.raf);u().coins+=earned;persist();render();notify(`Runde beendet · ${score} Punkte · +${earned} Coins`)}function stopGame(){if(game?.raf)cancelAnimationFrame(game.raf);game=null}
window.addEventListener('keydown',ev=>{if(ev.code==='Space'&&tab==='runner'&&current&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){ev.preventDefault();G.jump()}});window.G=G;cloudStart();})();
</script></body></html>
