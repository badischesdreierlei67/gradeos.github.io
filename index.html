Math.sin((game?.distance||0)*2);c.save();c.translate(104,y);c.strokeStyle='#d0d5df';c.lineWidth=10;c.lineCap='round';c.beginPath();c.moveTo(-16,-5);c.lineTo(-18+run*7,9);c.moveTo(10,-5);c.lineTo(12-run*7,9);c.stroke();c.fillStyle='#fbfdff';c.strokeStyle='#9caac0';c.lineWidth=2;c.beginPath();c.ellipse(-6,-37,33,24,0,0,Math.PI*2);c.fill();c.stroke();c.beginPath();c.moveTo(-20,-54);c.lineTo(-17,-93);c.lineTo(-1,-66);c.lineTo(15,-91);c.lineTo(22,-53);c.closePath();c.fill();c.stroke();c.beginPath();c.ellipse(12,-57,30,27,0,0,Math.PI*2);c.fill();c.stroke();c.fillStyle='#27334a';c.beginPath();c.arc(23,-59,4,0,Math.PI*2);c.fill();c.beginPath();c.ellipse(39,-47,8,5,0,0,Math.PI*2);c.fill();c.fillStyle='#fa788d';c.beginPath();c.ellipse(30,-37+Math.sin((game?.distance||0)*.3)*2,7,12,.1,0,Math.PI*2);c.fill();c.fillStyle='#e6b2c4';c.beginPath();c.ellipse(15,-70,5,9,0,0,Math.PI*2);c.fill();c.restore();for(const o of game?.obstacles||[]){c.fillStyle='#658785';c.strokeStyle='#44615e';c.lineWidth=2;c.fillRect(o.x,floor-48,24,48);c.strokeRect(o.x,floor-48,24,48);c.fillRect(o.x+6,floor-67,10,24);c.fillRect(o.x+23,floor-31,13,9)}c.font='600 13px -apple-system,Arial';c.fillStyle='#59677c';c.textAlign='right';c.fillText('SPACE / TIP · SPRINGEN',W-19,31);const score=document.getElementById('runner-score'),dist=document.getElementById('runner-distance');if(score)score.textContent=String(game?.score||0);if(dist)dist.textContent=String(Math.floor(game?.distance||0))}
function tick(time){if(!game?.running)return;const g=game,dt=Math.min(50,Math.max(0,time-g.lastFrame))/1000;g.lastFrame=time;g.distance+=dt*g.speed;g.speed=Math.min(24,10+g.distance/130);const elapsed=time-g.jumpStart;g.jumpHeight=elapsed>=0&&elapsed<850?Math.sin(Math.PI*elapsed/850)*145:0;const canvas=document.getElementById('runner-canvas'),width=canvas?.getBoundingClientRect().width||800;if(time-g.lastSpawn>Math.max(900,1780-g.distance*1.35)){g.obstacles.push({x:width+40,passed:false});g.lastSpawn=time}for(const o of g.obstacles){o.x-=dt*g.speed*21;if(!o.passed&&o.x<136){if(o.x>81&&g.jumpHeight<55){finishGame();return}o.passed=true;g.score+=10}}g.obstacles=g.obstacles.filter(o=>o.x>-45);drawGame();g.raf=requestAnimationFrame(tick)}
function finishGame(){if(!game)return;const earned=Math.min(10,Math.floor(game.score/10)),score=game.score;game.running=false;cancelAnimationFrame(game.raf);u().coins+=earned;persist();render();notify(`Runde beendet · ${score} Punkte · +${earned} Coins`)}function stopGame(){if(game?.raf)cancelAnimationFrame(game.raf);game=null}

Object.assign(G,{
 async adminOpen(){

   div.innerHTML='<div class="admin-panel" style="width:min(750px,100%);max-height:90vh;overflow:auto"><div class="row"><h2>✦ Admin · Konten</h2><button class="chip" onclick="G.adminClose()">✕</button></div><p class="muted">Profilvorschau, Kontostatus und Verwaltung.</p><div id="admin-records">Konten werden geladen …</div></div>';
   document.body.appendChild(div);await G.adminRefresh();
 },
 adminClose(){document.getElementById('gradeos-admin-overlay')?.remove()},
 async adminRequest(action,userId){
   if(!cloudClient||!cloudUser)throw Error('Bitte erneut anmelden.');
   const {data:{session}}=await cloudClient.auth.getSession();if(!session)throw Error('Sitzung abgelaufen.');
   const res=await fetch(cloudConfig.url+'/functions/v1/gradeos-admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':cloudConfig.anonKey},body:JSON.stringify({action,userId})});
   const body=await res.json().catch(()=>({error:'Ungültige Serverantwort'}));
   if(!res.ok)throw Error(body.error||'Serverfehler '+res.status);
   return body;
 },
 async adminRefresh(){
   const box=document.getElementById('admin-records');if(!box)return;
   box.textContent='Konten werden geladen …';
   try{const result=await G.adminRequest('list');const rows=result.users||[];
    if(!rows.length){box.textContent='Keine Konten gefunden.';return;}
    box.innerHTML=rows.map(p=>`<div class="admin-user-row"><span class="avatar" style="width:52px;height:52px">${p.avatar?`<img src="${e(p.avatar)}" alt="Profilbild">`:e((p.name||'?')[0])}</span><div style="flex:1;min-width:130px"><strong>${e(p.name||'Unbenannt')}</strong><small style="display:block;color:var(--muted);word-break:break-all">${e(p.email||'')} · ${p.banned?'Gesperrt':'Aktiv'}</small><small class="muted">${e(p.bio||'')}</small></div><div class="row" style="flex-wrap:wrap">${p.isAdmin?'<span class="pill">Administrator</span>':`<button class="btn" onclick="G.adminAction('${p.id}','${p.banned?'unban':'ban'}')">${p.banned?'Entsperren':'Sperren'}</button><button class="btn danger" onclick="G.adminAction('${p.id}','delete')">Löschen</button>`}</div></div>`).join('');
   }catch(err){box.textContent='Fehler: '+err.message+' · Hast du die Supabase Edge Function veröffentlicht und die ADMIN_USER_ID gesetzt?';}
 },
 async adminAction(uid,action){
   const words={ban:'sperren',unban:'entsperren',delete:'endgültig löschen'};

 }
